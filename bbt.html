<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Quality Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── SCREENS ── */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100%;
            position: absolute;
            inset: 0;
        }
        .screen.active { display: flex; }

        /* ── LOGIN ── */
        #screen-login { background: #000; gap: 40px; }

        .login-brand { text-align: center; }
        .login-icon  { font-size: 56px; display: block; margin-bottom: 12px; }
        .login-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .login-sub {
            font-size: 12px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: min(320px, 90vw);
        }

        .login-input {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            padding: 16px 20px;
            outline: none;
            text-align: center;
            letter-spacing: 6px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .login-input::placeholder { letter-spacing: 2px; color: #333; font-size: 14px; }
        .login-input:focus { border-color: #444; }

        .login-btn {
            background: #fff;
            border: none;
            border-radius: 14px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.15s;
        }
        .login-btn:active { opacity: 0.8; }

        .login-error {
            color: #ff4d4d;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        /* ── COUNTDOWN ── */
        #screen-countdown { background: #000; gap: 20px; }

        .countdown-num {
            font-size: 130px;
            font-weight: 900;
            line-height: 1;
            animation: pop 1s ease-in-out infinite;
        }
        @keyframes pop {
            0%,100% { transform: scale(1);   opacity: 1; }
            50%      { transform: scale(.85); opacity: .6; }
        }
        .countdown-label {
            font-size: 13px;
            color: #444;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ── VIDEO ── */
        #screen-video {
            display: none;
            position: relative;
            background: #000;
            height: 100dvh;
            width: 100%;
        }
        #screen-video.active { display: block; }

        /* header */
        .vid-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 20;
            padding: env(safe-area-inset-top, 12px) 16px 24px;
            padding-top: max(env(safe-area-inset-top, 0px), 12px);
            background: linear-gradient(to bottom, rgba(0,0,0,.75) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .vid-header-main {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .vid-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .vid-counter {
            font-size: 12px;
            color: rgba(255,255,255,.6);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .queue-filter {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            background: rgba(0,0,0,.35);
            flex-shrink: 0;
        }
        .queue-filter-btn {
            border: none;
            border-radius: 999px;
            background: transparent;
            color: rgba(255,255,255,.72);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            padding: 9px 12px;
            transition: background .15s ease, color .15s ease, opacity .15s ease;
        }
        .queue-filter-btn.active {
            background: #fff;
            color: #000;
        }
        .queue-filter-btn:disabled {
            opacity: .45;
            cursor: default;
        }
        .btn-mute {
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;
            color: #fff;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            transition: background .15s;
        }
        .btn-stop {
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;
            color: #fff;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            transition: background .15s;
        }
        .btn-stop:active { background: rgba(255,60,60,.5); }
        .vid-title {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,.9);
            text-align: left;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* player */
        .vid-player {
            position: absolute;
            inset: 0;
            background: #000;
        }
        .vid-video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }
        .vid-tap-zone {
            position: absolute;
            inset: 0;
            z-index: 5;
        }

        /* loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #1a1a1a;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* controls */
        /* ── PROGRESS BAR ── */
        .vid-progress {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 25;
            height: 3px;
            background: rgba(255,255,255,.2);
            cursor: pointer;
        }
        .vid-progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width .1s linear;
            pointer-events: none;
        }

        .action-rail {
            position: absolute;
            left: 50%;
            bottom: max(env(safe-area-inset-bottom, 0px), 18px);
            transform: translateX(-50%);
            z-index: 22;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: center;
            gap: 14px;
            width: min(100%, 360px);
            padding: 0 12px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-align: center;
            min-width: 60px;
        }

        .action-btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: rgba(44,44,44,.9);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 34px rgba(0,0,0,.3);
            transition: transform .12s ease, background .15s ease, filter .15s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .action-btn:active {
            transform: scale(.94);
            filter: brightness(.9);
        }
        .action-btn:hover {
            background: rgba(60,60,60,.94);
        }
        .action-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        .action-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .2px;
            text-shadow: 0 2px 10px rgba(0,0,0,.35);
        }
        .action-item.hidden {
            display: none;
        }
        .speed-btn {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .video-empty {
            position: absolute;
            inset: 0;
            z-index: 12;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
        }
        .video-empty-card {
            max-width: 320px;
        }
        .video-empty-title {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }
        .video-empty-sub {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: #7d7d7d;
        }

        #screen-video.queue-empty .vid-player,
        #screen-video.queue-empty .vid-progress,
        #screen-video.queue-empty .action-rail,
        #screen-video.queue-empty .swipe-hint {
            display: none;
        }
        #screen-video.queue-empty .video-empty {
            display: flex;
        }

        /* swipe hint */
        .swipe-hint {
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            animation: hint-fade 2.5s ease-out 1s forwards;
        }
        .swipe-hint span {
            font-size: 13px;
            color: rgba(255,255,255,.55);
            letter-spacing: 1px;
            background: rgba(0,0,0,.35);
            padding: 6px 12px;
            border-radius: 20px;
        }
        @keyframes hint-fade {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ── EMPTY ── */
        #screen-empty {
            background: #000;
            gap: 18px;
            text-align: center;
            padding: 32px;
        }
        .empty-icon  { font-size: 72px; }
        .empty-title { font-size: 24px; font-weight: 800; }
        .empty-sub   { font-size: 14px; color: #444; line-height: 1.6; }
        .btn-reload  {
            margin-top: 8px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 32px;
            cursor: pointer;
            transition: opacity .15s;
        }
        .btn-reload:active { opacity: .8; }

        /* ── ERROR ── */
        #screen-error {
            background: #000;
            gap: 18px;
            text-align: center;
            padding: 32px;
        }
        .error-icon  { font-size: 64px; }
        .error-title { font-size: 22px; font-weight: 800; }
        .error-msg   { font-size: 13px; color: #555; line-height: 1.6; }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.75);
            font-size: 72px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s, transform .15s;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="screen-login" class="screen active">
    <div class="login-brand">
        <span class="login-icon">🎬</span>
        <div class="login-title">Quality Check</div>
        <div class="login-sub">Shorts Review</div>
    </div>
    <div class="login-form">
        <input
            type="password"
            id="password-input"
            class="login-input"
            placeholder="Password"
            autocomplete="current-password"
        >
        <button class="login-btn" onclick="doLogin()">Sign In</button>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- ══ COUNTDOWN ══ -->
<div id="screen-countdown" class="screen">
    <div class="countdown-num" id="countdown-num">5</div>
    <div class="countdown-label">loading videos…</div>
</div>

<!-- ══ VIDEO ══ -->
<div id="screen-video" class="screen">

    <div class="vid-header">
        <div class="vid-header-main">
            <span class="vid-counter" id="vid-counter">— / —</span>
            <div class="queue-filter" aria-label="Queue filter">
                <button
                    id="queue-pending-btn"
                    class="queue-filter-btn active"
                    onclick="setQueue('pending')"
                    type="button"
                >Pending</button>
                <button
                    id="queue-maybe-btn"
                    class="queue-filter-btn"
                    onclick="setQueue('maybe')"
                    type="button"
                >Maybe</button>
            </div>
            <span class="vid-title" id="vid-title"></span>
        </div>
        <div class="vid-header-actions">
            <button class="btn-mute" id="btn-mute" onclick="toggleMute()" title="Mute / Unmute">🔇</button>
            <button class="btn-stop" onclick="stopSession()" title="Stop session">■</button>
        </div>
    </div>

    <div class="vid-player">
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
        </div>
        <video
            id="video-player"
            class="vid-video"
            playsinline
            autoplay
            loop
        ></video>
        <div class="vid-tap-zone" id="vid-tap-zone"></div>
    </div>

    <div class="vid-progress" id="vid-progress" onclick="seekVideo(event)">
        <div class="vid-progress-fill" id="vid-progress-fill"></div>
    </div>

    <div class="action-rail" id="action-rail">
        <div class="action-item">
            <button class="action-btn" onclick="rate('Approved')" title="Approve" aria-label="Approve">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
            </button>
            <span class="action-label">Approve</span>
        </div>

        <div class="action-item" id="action-maybe">
            <button class="action-btn" onclick="rate('Maybe')" title="Maybe" aria-label="Maybe">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247m2.325 6.443c.61 0 1.029-.394 1.029-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94 0 .533.425.927 1.01.927z"/>
                </svg>
            </button>
            <span class="action-label">Maybe</span>
        </div>

        <div class="action-item">
            <button class="action-btn" onclick="rate('Review')" title="Review" aria-label="Review">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M4.5 7.5a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1z"/>
                </svg>
            </button>
            <span class="action-label">Review</span>
        </div>

        <div class="action-item">
            <button class="action-btn" onclick="rate('Rejected')" title="Reject" aria-label="Reject">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293z"/>
                </svg>
            </button>
            <span class="action-label">Reject</span>
        </div>

        <div class="action-item">
            <button class="action-btn speed-btn" id="speed-btn" onclick="cycleSpeed()" title="Speed" aria-label="Speed">
                <span id="speed-label">1×</span>
            </button>
            <span class="action-label">Speed</span>
        </div>
    </div>

    <!-- swipe hint (fades out after first swipe) -->
    <div class="swipe-hint" id="swipe-hint">
        <span>← skip</span><span>back →</span>
    </div>

    <div class="video-empty" id="video-empty">
        <div class="video-empty-card">
            <div class="video-empty-title" id="video-empty-title">No videos found</div>
            <div class="video-empty-sub" id="video-empty-sub">Try switching the filter or check back later.</div>
        </div>
    </div>

</div>

<!-- ══ EMPTY ══ -->
<div id="screen-empty" class="screen">
    <div class="empty-icon">✅</div>
    <div class="empty-title">All caught up!</div>
    <div class="empty-sub">No videos pending review.<br>Check back later.</div>
    <button class="btn-reload" onclick="location.reload()">Reload</button>
</div>

<!-- ══ ERROR ══ -->
<div id="screen-error" class="screen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Failed to load</div>
    <div class="error-msg" id="error-msg">Could not connect to the server.</div>
    <button class="btn-reload" onclick="location.reload()">Try again</button>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<script>
    /* ─── CONFIG ─── */
    const PASSWORD        = 'bbt2026';
    const WEBHOOK_VIDEOS  = 'https://n8n.tntnews.org/webhook/videos-bbt';
    const WEBHOOK_LIKE    = 'https://n8n.tntnews.org/webhook/like-bbt';
    const WEBHOOK_MAYBE   = 'https://n8n.tntnews.org/webhook/maybe-bbt';
    const WEBHOOK_DISLIKE = 'https://n8n.tntnews.org/webhook/unlike-bbt';
    const WEBHOOK_REVIEW  = 'https://n8n.tntnews.org/webhook/review-bbt';

    /* ─── STATE ─── */
    let videos       = [];        // [{recordId, title, googleId, link}]
    let currentIndex = 0;
    let visitedStack = [];        // ordered list of visited indexes
    let ratedSet     = new Set(); // indexes that were rated
    let isRating     = false;
    let currentQueue = 'pending';
    let isQueueLoading = false;
    let videosReady  = false;
    let videosResult = null;

    /* ─── SCREEN MANAGER ─── */
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + id).classList.add('active');
    }

    /* ─── LOGIN ─── */
    document.getElementById('password-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });

    // auto-login se já autenticou antes
    if (localStorage.getItem('qc_auth') === '1') {
        showScreen('countdown');
        startCountdown();
    }

    function doLogin() {
        const val = document.getElementById('password-input').value.trim();
        if (val === PASSWORD) {
            localStorage.setItem('qc_auth', '1');
            document.getElementById('login-error').textContent = '';
            showScreen('countdown');
            startCountdown();
        } else {
            const err = document.getElementById('login-error');
            err.textContent = 'Incorrect password.';
            document.getElementById('password-input').value = '';
            document.getElementById('password-input').focus();
        }
    }

    function buildVideosUrl(queue = currentQueue) {
        const url = new URL(WEBHOOK_VIDEOS);

        if (queue === 'maybe') {
            url.searchParams.set('queue', 'maybe');
            url.searchParams.set('quality', 'Maybe');
        } else {
            url.searchParams.set('queue', 'pending');
            url.searchParams.set('quality', 'Pending');
        }

        return url.toString();
    }

    async function fetchVideos(queue = currentQueue) {
        try {
            const res = await fetch(buildVideosUrl(queue), { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const text = await res.text();
            return text.trim() ? JSON.parse(text) : [];
        } catch (e) {
            // empty or invalid JSON → treat as no videos pending
            return [];
        }
    }

    function startCountdown() {
        videosReady = false;
        fetchVideos(currentQueue).then(data => {
            videosResult = data;
            videosReady = true;
        });

        let n = 5;
        const el = document.getElementById('countdown-num');
        el.textContent = n;

        const timer = setInterval(() => {
            n--;
            if (n > 0) {
                el.textContent = n;
            } else {
                clearInterval(timer);
                waitThenBegin();
            }
        }, 1000);
    }

    function waitThenBegin() {
        if (!videosReady) { setTimeout(waitThenBegin, 200); return; }

        applyVideos(videosResult);
    }

    /* ─── NORMALIZE AIRTABLE / N8N RESPONSE ─── */
    function normalizeVideos(data) {
        if (!data) return [];

        // wrap single object
        if (!Array.isArray(data)) data = [data];
        if (data.length === 0) return [];

        const first = data[0];

        // Helper: encontra o valor de um campo ignorando BOM (\uFEFF) e case
        function getField(obj, ...names) {
            // índice dos campos sem BOM e em lowercase
            const clean = Object.fromEntries(
                Object.entries(obj).map(([k, v]) => [k.replace(/^\uFEFF/, '').toLowerCase(), v])
            );
            for (const name of names) {
                const val = clean[name.toLowerCase()];
                if (val !== undefined && val !== null && val !== '') return val;
            }
            return '';
        }

        function cleanText(value) {
            return typeof value === 'string' ? value.trim() : String(value || '').trim();
        }

        function hasField(obj, name) {
            return Object.keys(obj).some(key => key.replace(/^\uFEFF/, '').toLowerCase() === name.toLowerCase());
        }

        function matchesCurrentQueue(obj) {
            if (!hasField(obj, 'Quality')) return true;

            const quality = String(getField(obj, 'Quality')).trim().toLowerCase();
            return currentQueue === 'maybe'
                ? quality === 'maybe'
                : !quality || quality === 'pending';
        }

        // Intercala os vídeos para que nunca dois consecutivos sejam do mesmo projectId.
        // Greedy: sempre escolhe o vídeo de maior nota cujo projectId ≠ ao do último inserido.
        function spreadByProject(list) {
            const remaining = [...list]; // já ordenado por nota desc
            const result = [];

            while (remaining.length > 0) {
                const lastId = result.length > 0 ? result[result.length - 1].projectId : null;

                // índice do primeiro vídeo com projectId diferente do último
                let idx = remaining.findIndex(v => v.projectId == null || v.projectId !== lastId);

                // se todos têm o mesmo projectId, adiciona o de maior nota mesmo assim
                if (idx === -1) idx = 0;

                result.push(remaining.splice(idx, 1)[0]);
            }

            return result;
        }

        function sortAndSpread(list) {
            list.sort((a, b) => (b.note ?? -Infinity) - (a.note ?? -Infinity));
            return spreadByProject(list);
        }

        // Airtable native format: {id, fields: {Title, 'Google ID', Link, ...}}
        if (first && first.fields !== undefined) {
            const mapped = data
                .filter(r => matchesCurrentQueue(r.fields))
                .map(r => ({
                    recordId  : r.id,
                    title     : cleanText(getField(r.fields, 'Title', 'title', 'name')) || 'Untitled',
                    googleId  : cleanText(getField(r.fields, 'Google ID', 'googleId', 'google_id')),
                    link      : cleanText(getField(r.fields, 'Link', 'link', 'url')),
                    r2Url     : cleanText(getField(r.fields, 'R2 URL', 'r2Url', 'r2url')),
                    note      : parseFloat(getField(r.fields, 'Note', 'Nota', 'Score')) || null,
                    projectId : getField(r.fields, 'ProjectId', 'Project ID', 'projectId') || null,
                }))
                .filter(v => getPlayableSources(v).length && v.recordId);
            return sortAndSpread(mapped);
        }

        // Formato flat do n8n (campos no nível raiz) — ex: {id, "﻿Title", "Google ID", "Link", ...}
        const mapped = data
            .filter(matchesCurrentQueue)
            .map(r => ({
                recordId  : r.id || r.recordId,
                title     : cleanText(getField(r, 'Title', 'title', 'name')) || 'Untitled',
                googleId  : cleanText(getField(r, 'Google ID', 'googleId', 'google_id', 'googleID')),
                link      : cleanText(getField(r, 'Link', 'link', 'url')),
                r2Url     : cleanText(getField(r, 'R2 URL', 'r2Url', 'r2url')),
                note      : parseFloat(getField(r, 'Note', 'Nota', 'Score')) || null,
                projectId : getField(r, 'ProjectId', 'Project ID', 'projectId') || null,
            }))
            .filter(v => getPlayableSources(v).length && v.recordId);
        return sortAndSpread(mapped);
    }

    function extractGoogleDriveId(value) {
        const raw = typeof value === 'string' ? value.trim() : String(value || '').trim();
        if (!raw) return '';

        if (!/^https?:\/\//i.test(raw)) return raw;

        try {
            const url = new URL(raw);
            const paramId = url.searchParams.get('id');
            if (paramId) return paramId.trim();

            const match = url.pathname.match(/\/file\/d\/([^/]+)/i)
                       || url.pathname.match(/\/d\/([^/]+)/i);
            return match ? match[1].trim() : '';
        } catch {
            return '';
        }
    }

    function getPlayableSources(item) {
        const sources = [];
        const r2Url = typeof item?.r2Url === 'string' ? item.r2Url.trim() : '';
        if (/^https?:\/\//i.test(r2Url)) sources.push(r2Url);

        const link = typeof item?.link === 'string' ? item.link.trim() : '';
        if (/^https?:\/\//i.test(link)) sources.push(link);

        const googleId = extractGoogleDriveId(item?.googleId) || extractGoogleDriveId(link);
        if (googleId) {
            sources.push(`https://drive.google.com/uc?export=download&id=${encodeURIComponent(googleId)}`);
        }

        return [...new Set(sources)];
    }

    function updateQueueFilterUI() {
        const pendingBtn  = document.getElementById('queue-pending-btn');
        const maybeBtn    = document.getElementById('queue-maybe-btn');
        const maybeAction = document.getElementById('action-maybe');

        pendingBtn.classList.toggle('active', currentQueue === 'pending');
        maybeBtn.classList.toggle('active', currentQueue === 'maybe');
        pendingBtn.disabled = isQueueLoading;
        maybeBtn.disabled = isQueueLoading;
        maybeAction.classList.toggle('hidden', currentQueue === 'maybe');
    }

    function getQueueCopy() {
        if (currentQueue === 'maybe') {
            return {
                header: 'Maybe Queue',
                emptyTitle: 'No Maybe items',
                emptySub: 'Switch to Pending or check back later.'
            };
        }

        return {
            header: 'Pending Queue',
            emptyTitle: 'No pending items',
            emptySub: 'Switch to Maybe or check back later.'
        };
    }

    function showQueueEmptyState() {
        const copy    = getQueueCopy();
        const player  = document.getElementById('video-player');
        const loading = document.getElementById('loading-overlay');
        const screen  = document.getElementById('screen-video');

        player.pause();
        player.removeAttribute('src');
        player.load();

        document.getElementById('vid-counter').textContent = '— / —';
        document.getElementById('vid-title').textContent = copy.header;
        document.getElementById('video-empty-title').textContent = copy.emptyTitle;
        document.getElementById('video-empty-sub').textContent = copy.emptySub;

        loading.style.display = 'none';
        screen.classList.add('queue-empty');
        showScreen('video');
    }

    function showQueueVideoState() {
        document.getElementById('screen-video').classList.remove('queue-empty');
    }

    function showQueueLoadingState(queue) {
        const player  = document.getElementById('video-player');
        const loading = document.getElementById('loading-overlay');
        const title   = queue === 'maybe' ? 'Maybe Queue' : 'Pending Queue';

        videos = [];
        currentIndex = 0;
        visitedStack = [];
        ratedSet = new Set();

        player.pause();
        player.removeAttribute('src');
        player.load();

        document.getElementById('vid-counter').textContent = '— / —';
        document.getElementById('vid-title').textContent = title;

        showQueueVideoState();
        loading.style.display = 'flex';
        showScreen('video');
    }

    function applyVideos(data) {
        videos = normalizeVideos(data);
        currentIndex = 0;
        visitedStack = [];
        ratedSet     = new Set();
        isQueueLoading = false;

        updateQueueFilterUI();

        if (videos.length === 0) {
            showQueueEmptyState();
            return;
        }

        showQueueVideoState();
        showScreen('video');
        loadVideo(0);
    }

    async function setQueue(queue) {
        if (queue === currentQueue || isQueueLoading) return;

        currentQueue = queue;
        isQueueLoading = true;
        updateQueueFilterUI();
        showQueueLoadingState(queue);

        const data = await fetchVideos(queue);

        if (queue !== currentQueue) return;

        applyVideos(data);
    }

    /* ─── LOAD VIDEO ─── */
    function loadVideo(index) {
        const item = videos[index];
        if (!item) return;

        isRating = false;

        document.getElementById('vid-counter').textContent = `${index + 1} / ${videos.length}`;
        document.getElementById('vid-title').textContent   = item.title;

        // (back handled by swipe)

        const player  = document.getElementById('video-player');
        const loading = document.getElementById('loading-overlay');

        loading.style.display = 'flex';

        // Usa URL direta (campo Link) → <video> nativo; sem CSP, ended event funciona
        const sources = getPlayableSources(item);

        player.removeAttribute('src');
        player.load();

        if (sources.length === 0) {
            loading.style.display = 'none';
            console.warn('Skipping video with invalid source', item);
            advance();
            return;
        }

        requestAnimationFrame(() => {
            let sourceIndex = 0;

            const trySource = () => {
                const src = sources[sourceIndex];

                player.oncanplay = () => {
                    loading.style.display = 'none';
                    player.playbackRate = SPEEDS[speedIndex];
                };

                player.onerror = () => {
                    sourceIndex++;
                    if (sourceIndex < sources.length) {
                        console.warn('Video source failed, trying fallback', src);
                        trySource();
                        return;
                    }

                    loading.style.display = 'none';
                    console.warn('All video sources failed', item);
                    advance();
                };

                player.src = src;
                player.muted = true;      // muted garante autoplay em qualquer browser
                player.load();
                player.play().then(() => {
                    // desmutar só se o usuário já interagiu (unmutedByUser)
                    if (window._unmutedByUser) player.muted = false;
                }).catch(() => {});
            };

            trySource();
        });
    }

    /* ─── SPEED ─── */
    const SPEEDS = [1, 1.5, 2];
    let speedIndex = 0;
    function cycleSpeed() {
        speedIndex = (speedIndex + 1) % SPEEDS.length;
        const speed = SPEEDS[speedIndex];
        const player = document.getElementById('video-player');
        if (player) player.playbackRate = speed;
        document.getElementById('speed-label').textContent = speed + '×';
    }

    /* ─── RATE ─── */
    async function rate(quality) {
        if (isRating) return;
        isRating = true;

        const video   = videos[currentIndex];
        const webhook = quality === 'Approved' ? WEBHOOK_LIKE
                      : quality === 'Maybe'    ? WEBHOOK_MAYBE
                      : quality === 'Review'   ? WEBHOOK_REVIEW
                      :                          WEBHOOK_DISLIKE;
        const emoji   = quality === 'Approved' ? '👍'
                      : quality === 'Maybe'    ? '❔'
                      : quality === 'Review'   ? '🔵'
                      :                          '👎';

        showToast(emoji);
        ratedSet.add(currentIndex);

        // fire-and-forget — don't block UX on network
        fetch(webhook, {
            method  : 'POST',
            headers : { 'Content-Type': 'application/json' },
            body    : JSON.stringify({ recordId: video.recordId, quality }),
            cache   : 'no-store',
        }).catch(() => {});

        advance();
    }

    /* ─── SKIP (sem avaliar) ─── */
    function skipVideo() {
        if (isRating) return;
        advance();
    }

    /* ─── ADVANCE ─── */
    function advance() {
        visitedStack.push(currentIndex);

        const next = currentIndex + 1;
        if (next >= videos.length) {
            videos = [];
            showQueueEmptyState();
            return;
        }
        currentIndex = next;
        loadVideo(currentIndex);
    }

    /* ─── BACK (volta ao último assistido não avaliado) ─── */
    function goBack() {
        for (let i = visitedStack.length - 1; i >= 0; i--) {
            if (!ratedSet.has(visitedStack[i])) {
                const prev = visitedStack[i];
                visitedStack = visitedStack.slice(0, i); // remove from stack
                currentIndex = prev;
                loadVideo(currentIndex);
                return;
            }
        }
    }

    /* ─── TOAST ─── */
    function toggleMute() {
        const player = document.getElementById('video-player');
        const btn    = document.getElementById('btn-mute');
        player.muted = !player.muted;
        window._unmutedByUser = !player.muted;
        btn.textContent = player.muted ? '🔇' : '🔊';
    }

    function stopSession() {
        const player = document.getElementById('video-player');
        player.pause();
        player.removeAttribute('src');
        player.load();
        localStorage.removeItem('qc_auth');
        videos = [];
        currentQueue = 'pending';
        isQueueLoading = false;
        showQueueVideoState();
        updateQueueFilterUI();
        showScreen('login');
        document.getElementById('password-input').value = '';
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 700);
    }

    /* ─── PROGRESS BAR ─── */
    const _player = document.getElementById('video-player');
    const _fill   = document.getElementById('vid-progress-fill');

    _player.addEventListener('timeupdate', () => {
        if (!_player.duration) return;
        _fill.style.width = (_player.currentTime / _player.duration * 100) + '%';
    });

    function seekVideo(e) {
        if (!_player.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        _player.currentTime = ((e.clientX - rect.left) / rect.width) * _player.duration;
    }

    // video loops — advances only on like, dislike or swipe

    /* ─── SWIPE + TAP ─── */
    (function () {
        const THRESHOLD = 60;
        let startX = 0, startY = 0;
        let swipeFired = false;

        const tapZone = document.getElementById('vid-tap-zone');
        const player  = document.getElementById('video-player');

        // ── tap / click → pause (mobile + desktop) ──
        tapZone.addEventListener('click', () => {
            if (swipeFired) { swipeFired = false; return; }
            player.paused ? player.play() : player.pause();
        });

        // ── swipe → touch ──
        tapZone.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        tapZone.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) < THRESHOLD || Math.abs(dy) > Math.abs(dx)) return;
            swipeFired = true;
            if (dx < 0) skipVideo();
            else        goBack();
        }, { passive: true });

        // ── swipe → mouse (desktop) ──
        let mouseStartX = 0, mouseDown = false;
        tapZone.addEventListener('mousedown', e => { mouseStartX = e.clientX; mouseDown = true; });
        tapZone.addEventListener('mouseup', e => {
            if (!mouseDown) return;
            mouseDown = false;
            const dx = e.clientX - mouseStartX;
            if (Math.abs(dx) < THRESHOLD) return;
            swipeFired = true;
            if (dx < 0) skipVideo();
            else        goBack();
        });
        tapZone.addEventListener('mouseleave', () => { mouseDown = false; });

        // ── keyboard (desktop) ──
        document.addEventListener('keydown', e => {
            if (!document.getElementById('screen-video').classList.contains('active')) return;
            if (e.key === 'ArrowLeft')  skipVideo();
            if (e.key === 'ArrowRight') goBack();
            if (e.key === ' ') { e.preventDefault(); player.paused ? player.play() : player.pause(); }
        });
    })();
</script>
